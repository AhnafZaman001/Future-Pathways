# Supabase CLI project configuration for Future Pathways.
#
# This file enables `supabase start` (local dev stack) and
# `supabase db push` / `supabase migration up` (applying migrations).
#
# NOTE: project_id below is a placeholder local identifier used by the CLI
# to namespace local Docker containers. It is NOT the remote Supabase
# project ref and does not need to match anything in the Supabase dashboard.
# Linking to the real remote project happens separately via:
#   supabase link --project-ref <your-project-ref>
# (not run yet — see README for status).

project_id = "future-pathways"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
enabled = false

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[analytics]
enabled = false
