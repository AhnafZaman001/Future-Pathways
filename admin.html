<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
  // Apply the saved theme choice before first paint, so there's no
  // flash of the wrong theme. Actual toggle logic lives in
  // js/theme-toggle.js, loaded later; this is deliberately tiny and
  // synchronous so it can run this early.
  (function(){
    try {
      if (localStorage.getItem("kips-theme") === "light") {
        document.documentElement.setAttribute("data-theme", "light");
      }
    } catch (e) {}
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Future Pathways &mdash; Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/layout.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/pathways.css">
</head>
<body>

  <div class="bearing-line" aria-hidden="true"></div>

  <header class="site-header">
    <div class="wrap header-inner">
      <div class="brand">
        <span class="brand-mark">&#9670;</span>
        <span class="brand-name">KIPS</span>
        <span class="brand-tag">counsellor / admin</span>
      </div>
    </div>
  </header>

  <main class="wrap" style="max-width:960px;">
    <div class="fp-topbar">
      <a href="index.html" class="nav-link">&larr; Back to dashboard</a>
      <a href="merit.html" class="nav-link">Merit &amp; entry test guide</a>
      <a href="merit-calculator.html" class="nav-link">Calculate your merit</a>
      <span class="nav-spacer"></span>
      <button type="button" id="themeToggle" class="theme-toggle" aria-label="Switch to light theme"><span class="theme-toggle-glyph"></span><span class="theme-toggle-label">Dark</span></button>
      <button type="button" id="fp-logout" class="nav-link is-muted">Log out</button>
    </div>

    <div id="fp-admin-gate"></div>

    <div id="fp-admin-list-view">
      <div class="fp-stats-strip" id="fp-stats-strip"></div>

      <div class="fp-card">
        <div style="display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:16px;">
          <h2 class="fp-step-title" style="margin-bottom:0;">Submissions</h2>
          <button type="button" class="btn-primary" id="fp-admin-add-student">+ Add new student</button>
        </div>
        <div id="fp-bulk-actions" class="fp-bulk-actions" hidden>
          <span id="fp-bulk-count"></span>
          <button type="button" class="fp-row-action-link fp-row-action-delete" id="fp-bulk-delete">Delete selected</button>
        </div>
        <div class="fp-grid-2" style="margin-bottom:16px;">
          <label>Search by name
            <input type="search" id="filter-name" placeholder="e.g. Ahmed Khan" autocomplete="off">
          </label>
          <label>Pathway
            <select id="filter-pathway">
              <option value="">All</option>
              <option value="engineering">Engineering / Non-Medical</option>
              <option value="medical">Medical / Health Sciences</option>
            </select>
          </label>
          <label>Status
            <select id="filter-status">
              <option value="">All</option>
              <option value="draft">Draft</option>
              <option value="submitted">Submitted</option>
            </select>
          </label>
          <label>First priority university
            <select id="filter-first-priority">
              <option value="">All</option>
            </select>
          </label>
        </div>
        <div style="overflow-x:auto;">
          <table class="fp-admin-table" id="fp-admin-table">
            <thead>
              <tr><th style="width:1%;"><input type="checkbox" id="fp-select-all" aria-label="Select all"></th><th>Student</th><th>Pathway</th><th>First Priority</th><th>Status</th><th>Submitted</th><th>Actions</th></tr>
            </thead>
            <tbody id="fp-admin-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="fp-admin-detail-view" hidden></div>
  </main>

  <script src="js/theme-toggle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/fp-client.js"></script>
  <script src="js/fp-confirm.js"></script>
  <script src="js/fp-admin.js"></script>
</body>
</html>
