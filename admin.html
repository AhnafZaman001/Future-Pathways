<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
  // Apply the saved theme choice before first paint, so there's no
  // flash of the wrong theme. Actual toggle logic lives in
  // js/theme-toggle.js, loaded later; this is deliberately tiny and
  // synchronous so it can run this early.
  (function(){
    try {
      if (localStorage.getItem("kips-theme") === "light") {
        document.documentElement.setAttribute("data-theme", "light");
      }
    } catch (e) {}
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Future Pathways &mdash; Admin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/layout.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/pathways.css">
</head>
<body>

  <div class="bearing-line" aria-hidden="true"></div>

  <header class="site-header">
    <div class="wrap header-inner">
      <div class="brand">
        <span class="brand-mark">&#9670;</span>
        <span class="brand-name">KIPS</span>
        <span class="brand-tag">counsellor / admin</span>
      </div>
    </div>
  </header>

  <main class="wrap" style="max-width:960px;">
    <div class="fp-topbar">
      <a href="index.html" class="nav-link">&larr; Back to dashboard</a>
      <a href="admin.html" class="nav-link is-active">Student submissions</a>
      <a href="merit.html" class="nav-link">Merit &amp; entry test guide</a>
      <a href="merit-calculator.html" class="nav-link">Calculate your merit</a>
      <a href="rankings.html" class="nav-link">University Explorer</a>
      <span class="nav-spacer"></span>
      <button type="button" id="themeToggle" class="theme-toggle" aria-label="Switch to light theme"><span class="theme-toggle-glyph"></span><span class="theme-toggle-label">Dark</span></button>
      <button type="button" id="fp-logout" class="nav-link is-muted">Log out</button>
    </div>

    <div id="fp-admin-gate"></div>

    <div id="fp-admin-list-view">
      <div class="fp-stats-strip" id="fp-stats-strip"></div>

      <div class="fp-card">
        <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:16px;">
          <h2 class="fp-step-title" style="margin-bottom:0;">Submissions</h2>
          <div style="display:flex; align-items:center; gap:8px;">
            <button type="button" class="btn-secondary" id="fp-export-csv" title="Export filtered records as CSV">&#8681; Export CSV</button>
            <button type="button" class="btn-primary" id="fp-admin-add-student">+ Add new student</button>
          </div>
        </div>
        <div class="fp-grid-2" style="margin-bottom:10px;">
          <label>Search by name
            <input type="search" id="filter-name" placeholder="Type a name…" autocomplete="off">
          </label>
          <label>Pathway
            <select id="filter-pathway">
              <option value="">All</option>
              <option value="engineering">Engineering / Non-Medical</option>
              <option value="medical">Medical / Health Sciences</option>
            </select>
          </label>
          <label>Status
            <select id="filter-status">
              <option value="">All</option>
              <option value="draft">Draft</option>
              <option value="submitted">Submitted</option>
            </select>
          </label>
          <label>First priority university
            <select id="filter-first-priority">
              <option value="">All</option>
            </select>
          </label>
        </div>
        <div id="fp-active-filter-chips" class="fp-filter-chips" style="margin-bottom:16px;" hidden></div>
        <div id="fp-bulk-actions" class="fp-bulk-actions" hidden>
          <span id="fp-bulk-count" class="fp-bulk-count"></span>
          <div class="fp-bulk-menu-wrapper">
            <button type="button" class="fp-bulk-dropdown-btn" id="fp-bulk-dropdown-toggle" aria-expanded="false" aria-haspopup="true">
              Actions <span class="fp-bulk-dropdown-caret">&#9662;</span>
            </button>
            <div class="fp-bulk-dropdown-menu" id="fp-bulk-dropdown-menu" hidden>
              <button type="button" class="fp-bulk-dropdown-item fp-bulk-clear-item" id="fp-bulk-clear">
                <span class="fp-bulk-item-icon">&#8635;</span> Clear data for selected
              </button>
              <button type="button" class="fp-bulk-dropdown-item fp-bulk-delete-item" id="fp-bulk-delete">
                <span class="fp-bulk-item-icon">&#10005;</span> Delete selected
              </button>
            </div>
          </div>
        </div>
        <div style="overflow-x:auto;">
          <table class="fp-admin-table" id="fp-admin-table">
            <thead>
              <tr>
                <th style="width:1%;"><input type="checkbox" id="fp-select-all" aria-label="Select all"></th>
                <th class="fp-th-sortable" data-sort="name"><button type="button" class="fp-th-btn">Student <span class="fp-th-sort-icon">&#8693;</span></button></th>
                <th class="fp-th-sortable" data-sort="pathway"><button type="button" class="fp-th-btn">Pathway <span class="fp-th-sort-icon">&#8693;</span></button></th>
                <th class="fp-th-sortable" data-sort="first_priority"><button type="button" class="fp-th-btn">First Priority <span class="fp-th-sort-icon">&#8693;</span></button></th>
                <th class="fp-th-sortable" data-sort="status"><button type="button" class="fp-th-btn">Status <span class="fp-th-sort-icon">&#8693;</span></button></th>
                <th class="fp-th-sortable" data-sort="submitted_at"><button type="button" class="fp-th-btn">Submitted <span class="fp-th-sort-icon">&#8693;</span></button></th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="fp-admin-tbody"></tbody>
          </table>
        </div>
        <div id="fp-pagination-bar" class="fp-pagination"></div>
      </div>
    </div>

    <div id="fp-admin-detail-view" hidden></div>
  </main>

  <script src="js/theme-toggle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/fp-client.js"></script>
  <script src="js/fp-toast.js"></script>
  <script src="js/fp-confirm.js"></script>
  <script src="js/fp-admin.js"></script>
</body>
</html>
