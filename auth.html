<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in &mdash; Rah</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/layout.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/pathways.css">
</head>
<body>

  <div class="bearing-line" aria-hidden="true"></div>

  <header class="site-header">
    <div class="wrap header-inner">
      <div class="brand">
        <span class="brand-mark">&#9670;</span>
        <span class="brand-name">Rah</span>
        <span class="brand-tag">university counsellor</span>
      </div>
    </div>
  </header>

  <main class="wrap" style="max-width:440px; padding-top:48px;">
    <div class="fp-card">
      <button type="button" id="google-signin" class="btn-secondary fp-google-btn">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.98v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.18.29-1.72V4.95H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.05l2.99-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.59-2.59C13.46.89 11.43 0 9 0A9 9 0 0 0 .98 4.95l2.99 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
        Continue with Google
      </button>

      <div class="fp-divider"><span>or</span></div>

      <div class="fp-tabs" role="tablist">
        <button type="button" class="fp-tab is-active" data-tab="login">Log in</button>
        <button type="button" class="fp-tab" data-tab="signup">Sign up</button>
      </div>

      <form id="login-form" class="fp-form">
        <label>Email
          <input type="email" id="login-email" required autocomplete="email">
        </label>
        <label>Password
          <input type="password" id="login-password" required autocomplete="current-password">
        </label>
        <p class="fp-error" id="login-error" hidden></p>
        <button type="submit" class="btn-primary">Log in</button>
      </form>

      <form id="signup-form" class="fp-form" hidden>
        <label>Full name
          <input type="text" id="signup-name" required autocomplete="name">
        </label>
        <label>Email
          <input type="email" id="signup-email" required autocomplete="email">
        </label>
        <label>Password <span class="fp-hint">(min. 6 characters)</span>
          <input type="password" id="signup-password" required minlength="6" autocomplete="new-password">
        </label>
        <p class="fp-error" id="signup-error" hidden></p>
        <p class="fp-note" id="signup-note" hidden></p>
        <button type="submit" class="btn-primary">Create account</button>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/fp-client.js"></script>
  <script>
    (function(){
      var params = new URLSearchParams(window.location.search);
      var next = params.get("next") || "index.html";
      // guard against an open-redirect via a crafted next= value
      if(!/^[a-zA-Z0-9_-]+\.html$/.test(next)) next = "index.html";

      var tabs = document.querySelectorAll(".fp-tab");
      var forms = { login: document.getElementById("login-form"), signup: document.getElementById("signup-form") };

      tabs.forEach(function(tab){
        tab.addEventListener("click", function(){
          tabs.forEach(function(t){ t.classList.remove("is-active"); });
          tab.classList.add("is-active");
          Object.keys(forms).forEach(function(k){ forms[k].hidden = (k !== tab.dataset.tab); });
        });
      });

      // Already logged in? go straight to where they were headed.
      FP.getSession().then(function(session){
        if(session) window.location.href = next;
      });

      // Surface an OAuth provider error, e.g. ?error_description=... on redirect back.
      var oauthError = params.get("error_description");
      if(oauthError){
        var errEl = document.getElementById("login-error");
        errEl.textContent = oauthError;
        errEl.hidden = false;
      }

      document.getElementById("google-signin").addEventListener("click", function(){
        FP.signInWithGoogle(next);
      });

      document.getElementById("login-form").addEventListener("submit", function(e){
        e.preventDefault();
        var errEl = document.getElementById("login-error");
        errEl.hidden = true;
        var email = document.getElementById("login-email").value.trim();
        var password = document.getElementById("login-password").value;
        FP.signIn(email, password).then(function(result){
          if(result.error){
            errEl.textContent = result.error.message;
            errEl.hidden = false;
            return;
          }
          window.location.href = next;
        });
      });

      document.getElementById("signup-form").addEventListener("submit", function(e){
        e.preventDefault();
        var errEl = document.getElementById("signup-error");
        var noteEl = document.getElementById("signup-note");
        errEl.hidden = true; noteEl.hidden = true;
        var name = document.getElementById("signup-name").value.trim();
        var email = document.getElementById("signup-email").value.trim();
        var password = document.getElementById("signup-password").value;
        FP.signUp(email, password, name).then(function(result){
          if(result.error){
            errEl.textContent = result.error.message;
            errEl.hidden = false;
            return;
          }
          if(result.data.session){
            window.location.href = next;
          } else {
            noteEl.textContent = "Account created. Check your email to confirm, then log in.";
            noteEl.hidden = false;
          }
        });
      });
    })();
  </script>
</body>
</html>
