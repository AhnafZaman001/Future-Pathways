<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
  (function(){
    try {
      if (localStorage.getItem("kips-theme") === "light") {
        document.documentElement.setAttribute("data-theme", "light");
      }
    } catch (e) {}
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password &mdash; KIPS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/layout.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/pathways.css">
</head>
<body>

  <div class="bearing-line" aria-hidden="true"></div>

  <header class="site-header">
    <div class="wrap header-inner">
      <div class="header-top">
        <div class="brand">
          <span class="brand-mark">&#9670;</span>
          <span class="brand-name">KIPS</span>
          <span class="brand-tag">future pathway university counsellor</span>
        </div>
        <button type="button" id="themeToggle" class="theme-toggle" aria-label="Switch to light theme"><span class="theme-toggle-glyph"></span><span class="theme-toggle-label">Dark</span></button>
      </div>
    </div>
  </header>

  <main class="wrap" style="max-width:380px; padding-top:48px;">
    <div class="fp-card">
      <h1 style="margin:0 0 4px; font-size:1.15rem;">Reset your password</h1>
      <p class="fp-hint" style="margin:0 0 20px;">Enter your account email and we'll send you a reset link.</p>

      <p class="fp-error" id="fp-error" hidden></p>
      <p class="fp-hint" id="fp-success" hidden style="color: var(--green, #3fb950); margin:0 0 16px;">
        If an account exists for that email, a reset link is on its way. Check your inbox.
      </p>

      <form id="forgot-form" class="fp-form">
        <label>Email
          <input type="email" id="forgot-email" required autocomplete="username">
        </label>
        <button type="submit" class="btn-primary" id="forgot-btn">Send reset link</button>
      </form>

      <p class="fp-hint" style="margin:14px 0 0; text-align:center; font-size:.85rem;">
        <a href="login.html">Back to sign in</a>
      </p>
    </div>
  </main>

  <script src="js/theme-toggle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/fp-client.js"></script>
  <script src="js/fp-toast.js"></script>
  <script>
    (function(){
      var form = document.getElementById("forgot-form");
      var errBox = document.getElementById("fp-error");
      var successBox = document.getElementById("fp-success");
      var btn = document.getElementById("forgot-btn");

      form.addEventListener("submit", function(e){
        e.preventDefault();
        errBox.hidden = true;
        successBox.hidden = true;
        btn.disabled = true; btn.textContent = "Sending\u2026";
        var email = document.getElementById("forgot-email").value.trim();

        FP.requestPasswordReset(email).then(function(){
          // Supabase doesn't reveal whether the email exists -- always
          // show the same success state so this can't be used to probe
          // which emails have accounts.
          form.hidden = true;
          successBox.hidden = false;
        }).catch(function(err){
          var msg = (err && err.message) || "Could not send reset email. Try again.";
          errBox.textContent = msg;
          errBox.hidden = false;
          if(window.FP && window.FP.toast) FP.toast.error(msg);
        }).finally(function(){
          btn.disabled = false; btn.textContent = "Send reset link";
        });
      });
    })();
  </script>
</body>
</html>
