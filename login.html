<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
  // Apply the saved theme choice before first paint, so there's no
  // flash of the wrong theme. Actual toggle logic lives in
  // js/theme-toggle.js, loaded later; this is deliberately tiny and
  // synchronous so it can run this early.
  (function(){
    try {
      if (localStorage.getItem("kips-theme") === "light") {
        document.documentElement.setAttribute("data-theme", "light");
      }
    } catch (e) {}
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in &mdash; KIPS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/layout.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/pathways.css">
</head>
<body>

  <div class="bearing-line" aria-hidden="true"></div>

  <header class="site-header">
    <div class="wrap header-inner">
      <div class="header-top">
        <div class="brand">
          <span class="brand-mark">&#9670;</span>
          <span class="brand-name">KIPS</span>
          <span class="brand-tag">university counsellor</span>
        </div>
        <button type="button" id="themeToggle" class="theme-toggle" aria-label="Switch to light theme"><span class="theme-toggle-glyph"></span><span class="theme-toggle-label">Dark</span></button>
      </div>
    </div>
  </header>

  <main class="wrap" style="max-width:380px; padding-top:48px;">
    <div class="fp-card">
      <p class="fp-error" id="login-error" hidden></p>
      <form id="login-form" class="fp-form">
        <label>Email
          <input type="email" id="login-email" required autocomplete="username">
        </label>
        <label>Password
          <input type="password" id="login-password" required autocomplete="current-password">
        </label>
        <button type="submit" class="btn-primary" id="login-btn">Sign In</button>
      </form>
    </div>
  </main>

  <section class="wrap login-figs">
    <div class="login-figs-grid">

      <figure class="login-fig">
        <span class="login-fig-label">FIG 01</span>
        <svg viewBox="20 10 180 190" class="login-fig-svg" aria-hidden="true">
          <path d="M 160.0,50.0 L 100.0,80.0 L 100.0,90.0 L 160.0,60.0 Z" class="iso-face-right"/>
          <path d="M 40.0,50.0 L 100.0,80.0 L 100.0,90.0 L 40.0,60.0 Z" class="iso-face-left"/>
          <path d="M 100.0,20.0 L 160.0,50.0 L 100.0,80.0 L 40.0,50.0 Z" class="iso-face-top" fill="var(--violet-dim)"/>
          <path d="M 160.0,74.0 L 100.0,104.0 L 100.0,114.0 L 160.0,84.0 Z" class="iso-face-right"/>
          <path d="M 40.0,74.0 L 100.0,104.0 L 100.0,114.0 L 40.0,84.0 Z" class="iso-face-left"/>
          <path d="M 100.0,44.0 L 160.0,74.0 L 100.0,104.0 L 40.0,74.0 Z" class="iso-face-top"/>
          <path d="M 160.0,98.0 L 100.0,128.0 L 100.0,138.0 L 160.0,108.0 Z" class="iso-face-right"/>
          <path d="M 40.0,98.0 L 100.0,128.0 L 100.0,138.0 L 40.0,108.0 Z" class="iso-face-left"/>
          <path d="M 100.0,68.0 L 160.0,98.0 L 100.0,128.0 L 40.0,98.0 Z" class="iso-face-top"/>
          <path d="M 160.0,122.0 L 100.0,152.0 L 100.0,162.0 L 160.0,132.0 Z" class="iso-face-right"/>
          <path d="M 40.0,122.0 L 100.0,152.0 L 100.0,162.0 L 40.0,132.0 Z" class="iso-face-left"/>
          <path d="M 100.0,92.0 L 160.0,122.0 L 100.0,152.0 L 40.0,122.0 Z" class="iso-face-top"/>
        </svg>
        <figcaption>Ranked preferences<span>4 groups &times; 5 choices, tracked in order</span></figcaption>
      </figure>

      <figure class="login-fig">
        <span class="login-fig-label">FIG 02</span>
        <svg viewBox="0 15 200 175" class="login-fig-svg" aria-hidden="true">
          <path d="M 135.0,37.5 L 100.0,55.0 L 100.0,100.0 L 135.0,82.5 Z" class="iso-face-right"/>
          <path d="M 65.0,37.5 L 100.0,55.0 L 100.0,100.0 L 65.0,82.5 Z" class="iso-face-left"/>
          <path d="M 100.0,20.0 L 135.0,37.5 L 100.0,55.0 L 65.0,37.5 Z" class="iso-face-top"/>
          <path d="M 75.0,72.5 L 40.0,90.0 L 40.0,145.0 L 75.0,127.5 Z" class="iso-face-right"/>
          <path d="M 5.0,72.5 L 40.0,90.0 L 40.0,145.0 L 5.0,127.5 Z" class="iso-face-left"/>
          <path d="M 40.0,55.0 L 75.0,72.5 L 40.0,90.0 L 5.0,72.5 Z" class="iso-face-top"/>
          <path d="M 180.0,75.0 L 150.0,90.0 L 150.0,130.0 L 180.0,115.0 Z" class="iso-face-right"/>
          <path d="M 120.0,75.0 L 150.0,90.0 L 150.0,130.0 L 120.0,115.0 Z" class="iso-face-left"/>
          <path d="M 150.0,60.0 L 180.0,75.0 L 150.0,90.0 L 120.0,75.0 Z" class="iso-face-top"/>
          <path d="M 125.0,110.0 L 95.0,125.0 L 95.0,167.0 L 125.0,152.0 Z" class="iso-face-right"/>
          <path d="M 65.0,110.0 L 95.0,125.0 L 95.0,167.0 L 65.0,152.0 Z" class="iso-face-left"/>
          <path d="M 95.0,95.0 L 125.0,110.0 L 95.0,125.0 L 65.0,110.0 Z" class="iso-face-top" fill="var(--violet-dim)"/>
        </svg>
        <figcaption>Institutes tracked<span>Engineering and medical, kept current</span></figcaption>
      </figure>

      <figure class="login-fig">
        <span class="login-fig-label">FIG 03</span>
        <svg viewBox="10 0 175 180" class="login-fig-svg" aria-hidden="true">
          <path d="M 30.0,30.0 L 85.0,38.0 L 85.0,168.0 L 30.0,160.0 Z" class="iso-face-top"/>
          <path d="M 70.0,15.0 L 125.0,19.0 L 125.0,149.0 L 70.0,145.0 Z" class="iso-face-top"/>
          <path d="M 110.0,5.0 L 165.0,5.0 L 165.0,135.0 L 110.0,135.0 Z" class="iso-face-top" fill="var(--violet-dim)"/>
        </svg>
        <figcaption>Verified records<span>Merit formulas and closing merit, sourced not guessed</span></figcaption>
      </figure>

    </div>
  </section>

  <script src="js/theme-toggle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/fp-client.js"></script>
  <script>
    (function(){
      // If already signed in, skip straight to the app.
      FP.getSessionAndProfile().then(function(existing){
        if(existing) window.location.href = "index.html";
      });

      var form = document.getElementById("login-form");
      var errBox = document.getElementById("login-error");
      var btn = document.getElementById("login-btn");

      form.addEventListener("submit", function(e){
        e.preventDefault();
        errBox.hidden = true;
        btn.disabled = true; btn.textContent = "Signing in\u2026";
        var email = document.getElementById("login-email").value.trim();
        var password = document.getElementById("login-password").value;
        FP.signIn(email, password).then(function(){
          window.location.href = "index.html";
        }).catch(function(err){
          errBox.textContent = (err && err.message) || "Could not sign in. Check your email and password.";
          errBox.hidden = false;
          btn.disabled = false; btn.textContent = "Sign In";
        });
      });
    })();
  </script>
</body>
</html>
