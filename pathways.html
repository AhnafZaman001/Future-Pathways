<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Future Pathways &mdash; Rah</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/layout.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/pathways.css">
</head>
<body>

  <div class="bearing-line" aria-hidden="true"></div>

  <header class="site-header">
    <div class="wrap header-inner">
      <div class="brand">
        <span class="brand-mark">&#9670;</span>
        <span class="brand-name">Rah</span>
        <span class="brand-tag">future pathways</span>
      </div>
    </div>
  </header>

  <main class="wrap" style="max-width:720px;">
    <div class="fp-topbar">
      <span id="fp-user-email"></span>
      <button type="button" id="fp-logout">Log out</button>
    </div>

    <div id="fp-status-banner"></div>

    <div class="fp-progress" id="fp-progress"></div>
    <p class="fp-progress-label" id="fp-progress-label"></p>

    <div class="fp-card">
      <div id="fp-step-container"><!-- rendered by js/fp-app.js --></div>
      <div class="fp-actions">
        <button type="button" class="btn-secondary" id="fp-back">Back</button>
        <button type="button" class="btn-primary" id="fp-next">Save &amp; Continue</button>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/fp-client.js"></script>
  <script src="js/fp-app.js"></script>
</body>
</html>
