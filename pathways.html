<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Future Pathways &mdash; Rah</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/layout.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/pathways.css">
<link rel="stylesheet" href="styles/merit.css">
</head>
<body>

  <div class="bearing-line" aria-hidden="true"></div>

  <header class="site-header">
    <div class="wrap header-inner">
      <div class="brand">
        <span class="brand-mark">&#9670;</span>
        <span class="brand-name">Rah</span>
        <span class="brand-tag">future pathways</span>
      </div>
    </div>
  </header>

  <main class="wrap" style="max-width:720px;">
    <div class="fp-topbar">
      <span class="nav-spacer"></span>
      <a href="merit.html" class="nav-link">Merit &amp; entry test guide</a>
      <a href="rankings.html" class="nav-link">University Explorer</a>
      <button type="button" id="viewUnisBtn" class="nav-link">View all universities</button>
      <button type="button" id="fp-logout" class="nav-link is-muted">Log out</button>
    </div>

    <div id="uniModalOverlay" class="uni-modal-overlay" hidden>
      <div class="uni-modal" role="dialog" aria-modal="true" aria-labelledby="uniModalTitle">
        <div class="uni-modal-head">
          <h2 id="uniModalTitle">All listed universities</h2>
          <button type="button" id="uniModalClose" class="uni-modal-close" aria-label="Close">&times;</button>
        </div>
        <div class="uni-modal-body" id="uniModalBody"><!-- populated by js/fp-app.js --></div>
      </div>
    </div>

    <div id="fp-status-banner"></div>

    <div class="fp-layout">
      <div class="fp-main">
        <div class="fp-card">
          <div id="fp-step-container"><!-- rendered by js/fp-app.js --></div>
          <div class="fp-actions">
            <button type="button" class="btn-secondary" id="fp-back">Back</button>
            <button type="button" class="btn-primary" id="fp-next">Save &amp; Continue</button>
          </div>
        </div>
      </div>

      <aside class="fp-manifest-rail">
        <div class="fp-manifest">
          <div class="fp-manifest-head">Manifest</div>
          <div class="fp-manifest-body" id="fp-progress"><!-- rendered by js/fp-app.js --></div>
          <p class="fp-manifest-footer" id="fp-progress-label"></p>
        </div>
      </aside>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/fp-client.js"></script>
  <script src="js/fp-merit.js"></script>
  <script src="js/fp-app.js"></script>
</body>
</html>
