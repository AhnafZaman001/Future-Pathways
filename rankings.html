<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
  // Apply the saved theme choice before first paint, so there's no
  // flash of the wrong theme. Actual toggle logic lives in
  // js/theme-toggle.js, loaded later; this is deliberately tiny and
  // synchronous so it can run this early.
  (function(){
    try {
      if (localStorage.getItem("kips-theme") === "light") {
        document.documentElement.setAttribute("data-theme", "light");
      }
    } catch (e) {}
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>University Explorer | KIPS</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/layout.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/pathways.css">
<link rel="stylesheet" href="styles/merit.css">
<link rel="stylesheet" href="styles/rankings.css">
</head>
<body style="visibility:hidden">

  <div class="bearing-line" aria-hidden="true"></div>

  <header class="site-header">
    <div class="wrap header-inner">
      <div class="brand">
        <span class="brand-mark">&#9670;</span>
        <span class="brand-name">KIPS</span>
        <span class="brand-tag">university explorer</span>
      </div>
    </div>
  </header>

  <main class="wrap" style="max-width:820px;">
    <div class="fp-topbar">
      <a href="index.html" class="nav-link">&larr; Back to dashboard</a>
      <a href="pathways.html" class="nav-link">Future Pathways form</a>
      <a href="rankings.html" class="nav-link is-active">University Explorer</a>
      <a href="merit.html" class="nav-link">Merit &amp; entry test guide</a>
      <a href="merit-calculator.html" class="nav-link">Calculate your merit</a>
      <span class="nav-spacer"></span>
      <button type="button" id="themeToggle" class="theme-toggle" aria-label="Switch to light theme"><span class="theme-toggle-glyph"></span><span class="theme-toggle-label">Dark</span></button>
      <button type="button" id="fp-logout" class="nav-link is-muted">Log out</button>
    </div>

    <div class="rk-hero">
      <h1 class="fp-step-title">Find a program</h1>
      <p class="fp-step-desc">Pick a field, specialization, and city to see how universities rank for it &mdash; sourced, not guessed.</p>
    </div>

    <div class="fp-card rk-selector">
      <div class="fp-grid-3">
        <label>Field
          <select id="rk-field">
            <option value="">Select a field</option>
          </select>
        </label>
        <label>Specialization
          <select id="rk-subset" disabled>
            <option value="">Select a field first</option>
          </select>
        </label>
        <label>City
          <select id="rk-city">
            <option value="">All cities</option>
          </select>
        </label>
      </div>
    </div>

    <div id="rk-results"></div>
  </main>

  <script src="js/theme-toggle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/fp-client.js"></script>
  <script src="js/fp-toast.js"></script>
  <script src="js/fp-closing-merit.js"></script>
  <script src="js/rankings-data.js"></script>
  <script src="js/rankings.js"></script>
</body>
</html>
